name: Dagelijkse padel-screenshot

# De dagelijkse run draait op een eigen server (zie README): Playtomic blokkeert de
# servers van GitHub meestal. Deze workflow is daarom alleen nog handmatig te starten.
on:
  workflow_dispatch: {}   # handmatig starten via het tabblad Actions

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Playwright installeren
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Datum en tijd (Amsterdam)
        id: dt
        run: |
          echo "date=$(TZ=Europe/Amsterdam date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "time=$(TZ=Europe/Amsterdam date +%H:%M)" >> "$GITHUB_OUTPUT"

      - name: Screenshot maken
        id: shot
        continue-on-error: true
        run: node capture.js "plaza-padel-availability-${{ steps.dt.outputs.date }}.png"

      - name: Mail met screenshot
        if: steps.shot.outcome == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.resend.com
          server_port: 465
          secure: true
          username: resend   # bij Resend is de gebruikersnaam altijd letterlijk "resend"
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Padel screenshot <${{ secrets.MAIL_FROM }}>
          to: ${{ secrets.MAIL_TO }}
          subject: Padel Casa Enschede beschikbaarheid ${{ steps.dt.outputs.date }}
          body: |
            Dit is de dagelijkse capture van de baanbeschikbaarheid bij Padel Casa Enschede, gemaakt om ${{ steps.dt.outputs.time }} uur.
            De vrije tijdsloten voor vanavond staan in de bijgevoegde screenshot.
            Pagina: https://www.padelcasa.com/pages/enschede#/court-booking
          attachments: plaza-padel-availability-${{ steps.dt.outputs.date }}.png

      - name: Mail bij fout
        if: steps.shot.outcome != 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.resend.com
          server_port: 465
          secure: true
          username: resend   # bij Resend is de gebruikersnaam altijd letterlijk "resend"
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Padel screenshot <${{ secrets.MAIL_FROM }}>
          to: ${{ secrets.MAIL_TO }}
          subject: Padel Casa Enschede beschikbaarheid ${{ steps.dt.outputs.date }} (mislukt)
          body: |
            De dagelijkse screenshot van Padel Casa Enschede is vandaag (${{ steps.dt.outputs.time }} uur) mislukt.
            Zie de log op ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Pagina: https://www.padelcasa.com/pages/enschede#/court-booking
